name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Check build is reproducible
        run: npm run build:check

      - name: Verify runtime contracts
        run: npm run verify
