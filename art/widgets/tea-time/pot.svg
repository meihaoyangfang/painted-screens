<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="560" height="560">
  <defs>
    <linearGradient id="por" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#FDF8F2"/>
      <stop offset="0.8" stop-color="#EDE0D2"/>
      <stop offset="1" stop-color="#D8C6B4"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4E6D4"/>
      <stop offset="1" stop-color="#8BCBAF"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.36" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <ellipse cx="70" cy="124" rx="40" ry="6.5" fill="rgba(91,64,52,0.14)">
    <animate attributeName="opacity" values="1;1;0.55;1;0.85;1"
      keyTimes="0;0.86;0.89;0.92;0.95;1" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <g class="pot-body">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 0;0 -9;0 0;0 -2;0 0"
      keyTimes="0;0.86;0.89;0.92;0.94;1" dur="9s" repeatCount="indefinite"/>
    <!-- 壶嘴 -->
    <path d="M33 70 C18 68 12 56 15 44 L24 46 C21 55 24 61 35 62 Z"
          fill="url(#por)" stroke="rgba(95,168,140,0.5)" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- 把手 -->
    <path d="M108 64 C130 60 132 94 108 98" fill="none" stroke="rgba(95,168,140,0.5)" stroke-width="11" stroke-linecap="round"/>
    <path d="M108 64 C130 60 132 94 108 98" fill="none" stroke="url(#por)" stroke-width="7.5" stroke-linecap="round"/>
    <!-- 壶身 -->
    <path d="M30 68 C30 54 44 46 70 46 C96 46 110 54 110 68 L106 98 C104 110 90 116 70 116 C50 116 36 110 34 98 Z"
          fill="url(#por)" stroke="rgba(95,168,140,0.5)" stroke-width="1.8"/>
    <ellipse cx="54" cy="76" rx="17" ry="22" fill="url(#shine)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 底部一圈薄荷 -->
    <path d="M35 97 C50 105 90 105 105 97" fill="none" stroke="url(#band)" stroke-width="6" stroke-linecap="round"/>
    <!-- 壶口 -->
    <ellipse cx="70" cy="47" rx="40" ry="8.4" fill="#FDF7EF" stroke="rgba(95,168,140,0.5)" stroke-width="1.6"/>
    <!-- 草莓图案 -->
    <path d="M70 68 c5 -4 10 0 7 5 c-2.4 3.4 -5 5.2 -7 6.8 c-2 -1.6 -4.6 -3.4 -7 -6.8 c-3 -5 2 -9 7 -5 z"
          fill="#FF9DB1" stroke="rgba(226,96,127,0.5)" stroke-width="1"/>
    <path d="M66.5 67 l3.5 -4 l3.5 4 z" fill="#8BCBAF"/>
    <circle cx="68" cy="72" r="0.8" fill="#FFF"/><circle cx="72" cy="73" r="0.8" fill="#FFF"/>
  </g>

  <g class="pot-lid">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 0;0 -6;0 0;0 0"
      keyTimes="0;0.87;0.90;0.93;1" dur="9s" repeatCount="indefinite"/>
    <path d="M40 45 C40 33 52 26 70 26 C88 26 100 33 100 45 Z"
          fill="url(#por)" stroke="rgba(95,168,140,0.5)" stroke-width="1.6"/>
    <path d="M62 26 C62 20 78 20 78 26 Z" fill="#C4E6D4" stroke="rgba(95,168,140,0.5)" stroke-width="1.1"/>
    <circle cx="70" cy="18.5" r="4.2" fill="#FFB3C4" stroke="rgba(226,96,127,0.55)" stroke-width="1.1"/>
  </g>

  <g fill="none" stroke="rgba(226,96,127,0.42)" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 4;0 -8" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.8;0.45;0" keyTimes="0;0.35;0.7;1" dur="4.2s" repeatCount="indefinite"/>
    <path d="M60 10 c-4 -5 4 -8 0 -14"/>
    <path d="M80 10 c-4 -5 4 -8 0 -14"/>
  </g>
  <g fill="none" stroke="rgba(226,96,127,0.32)" stroke-width="1.8" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 3;0 -6" dur="4.2s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.7;0.35;0" keyTimes="0;0.35;0.7;1" dur="4.2s" begin="1.1s" repeatCount="indefinite"/>
    <path d="M70 8 c-4 -5 4 -8 0 -14"/>
  </g>
</svg>
