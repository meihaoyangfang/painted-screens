<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="560" height="560">
  <defs>
    <linearGradient id="lf" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#B7DB8E"/><stop offset="1" stop-color="#5E9B47"/>
    </linearGradient>
    <linearGradient id="lf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6EBB8"/><stop offset="1" stop-color="#8CC47F"/>
    </linearGradient>
  </defs>
  <ellipse cx="70" cy="126" rx="30" ry="5" fill="rgba(35,64,42,.12)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.2s" repeatCount="indefinite"/>
    <!-- 一片大叶 -->
    <path d="M72 118 C44 104 34 76 44 48 C58 56 70 78 72 118 Z" fill="url(#lf)"/>
    <path d="M70 116 C60 88 58 66 62 50" fill="none" stroke="#F2FAE8" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
    <!-- 一片小叶 -->
    <path d="M74 112 C92 100 102 80 100 58 C88 66 78 86 74 112 Z" fill="url(#lf2)"/>
    <path d="M76 110 C84 88 90 72 96 62" fill="none" stroke="#F6FCEF" stroke-width="2" stroke-linecap="round" opacity=".85"/>
    <!-- 茎 -->
    <path d="M73 122 C73 108 73 96 74 84" fill="none" stroke="#4E8B4A" stroke-width="4" stroke-linecap="round"/>
    <!-- 飘着的小花瓣 -->
    <g fill="#FFF0F4" stroke="#F3B9C8" stroke-width="1">
      <ellipse cx="104" cy="34" rx="5" ry="8" transform="rotate(24 104 34)">
        <animate attributeName="cy" values="34;26;34" dur="4.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="34" cy="48" rx="4" ry="6.4" transform="rotate(-18 34 48)">
        <animate attributeName="cy" values="48;40;48" dur="5.6s" begin="0.8s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
