  <path d="M110 16 C122 34 128 44 128 52 a18 18 0 0 1 -36 0 c0 -8 6 -18 18 -36z" fill="url(#flame)"/>
  <path d="M110 32 C116 42 119 48 119 53 a9 9 0 0 1 -18 0 c0 -5 3 -11 9 -21z" fill="#FFF8DE"/>
