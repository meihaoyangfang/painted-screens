<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" width="440" height="560">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6526"/>
      <stop offset="0.28" stop-color="#D9A441"/>
      <stop offset="0.5" stop-color="#F2D08A"/>
      <stop offset="0.72" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#7C5A20"/>
    </linearGradient>
    <linearGradient id="brassV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2D08A"/>
      <stop offset="0.45" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#8A6526"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E6"/>
      <stop offset="0.7" stop-color="#EFE1CC"/>
      <stop offset="1" stop-color="#D9C4A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD27A" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FF9A3C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF8A2B"/>
      <stop offset="0.55" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#FFF2C4"/>
    </linearGradient>
  </defs>

  <!-- 光晕 -->
  <circle cx="110" cy="52" r="86" fill="url(#glow)"/>

  <!-- 底座 -->
  <ellipse cx="110" cy="248" rx="58" ry="14" fill="url(#brassV)"/>
  <ellipse cx="110" cy="243" rx="52" ry="12" fill="url(#brass)"/>
  <path d="M72 232 Q110 218 148 232 L142 240 Q110 228 78 240 Z" fill="url(#brass)"/>

  <!-- 柱身 -->
  <rect x="99" y="150" width="22" height="86" fill="url(#brass)"/>
  <ellipse cx="110" cy="176" rx="20" ry="9" fill="url(#brass)"/>
  <ellipse cx="110" cy="176" rx="20" ry="9" fill="none" stroke="#7C5A20" stroke-width="1" opacity="0.5"/>
  <ellipse cx="110" cy="222" rx="26" ry="10" fill="url(#brass)"/>

  <!-- 滴油盘 -->
  <ellipse cx="110" cy="146" rx="40" ry="11" fill="url(#brass)"/>
  <ellipse cx="110" cy="142" rx="34" ry="9" fill="#B8842F"/>

