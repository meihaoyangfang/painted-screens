  <path d="M92 142 L92 74 Q92 68 98 68 L122 68 Q128 68 128 74 L128 142 Z" fill="url(#wax)"/>
  <path d="M92 88 q6 10 0 18 q-6 -8 0 -18z" fill="#F6EBDD"/>
  <path d="M128 104 q-6 12 0 22 q6 -10 0 -22z" fill="#EBDCC5"/>
